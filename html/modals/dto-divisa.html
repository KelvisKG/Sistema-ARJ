  <div class="confirm-modal" id="modal-dto-divisa">
    <div class="confirm-box">
      <h3><i class="ti ti-coins"></i> Descuento por pago en divisas</h3>
      <p style="margin-bottom:10px">Tus precios están en <strong>$ BCV</strong>. Convertirlos a efectivo
        equivale a <strong id="dd-neutro">—</strong>, y eso <u>no</u> es descuento: es la misma plata.<br>
        <span style="font-size:11.5px;color:var(--dgray)">Todo lo que pongas por encima sale de tu margen y
          se registra como descuento.</span></p>
      <div style="display:flex;gap:6px;align-items:center;justify-content:center;margin:10px 0">
        <input type="number" id="dd-pct" step="0.1" min="0" max="60" oninput="_ddPreview()"
          style="width:100px;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:16px;text-align:center;font-family:inherit">
        <span style="font-size:16px;font-weight:600">%</span>
        <button type="button" onclick="_ddNeutro()"
          style="padding:7px 12px;border:1px solid var(--border);background:#FFF;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit">Usar
          la brecha</button>
      </div>
      <div id="dd-preview" style="font-size:12.5px;padding:9px;border-radius:6px;background:#F2F5FA;line-height:1.6"></div>
      <div class="actions">
        <button class="btn btn-primary" onclick="guardarDtoDivisa()"><i class="ti ti-check"></i> Aplicar</button>
        <button class="btn btn-secondary" onclick="cerrarDtoDivisa()">Cancelar</button>
      </div>
    </div>
  </div>
