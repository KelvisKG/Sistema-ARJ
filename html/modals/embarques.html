    <div class="modal" id="modal-embarques">
      <div class="modal-content" style="max-width:720px;text-align:left">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;border-bottom:1px solid var(--gray);padding-bottom:12px">
          <h3 style="margin:0;font-size:18px;color:var(--navy);font-weight:600"><i class="ti ti-ship"></i> Embarques</h3>
          <button class="btn btn-secondary btn-sm" onclick="cerrarEmbarques()"><i class="ti ti-x"></i></button>
        </div>
        <div style="background:#FFF8E1;border-left:3px solid var(--gold);border-radius:6px;padding:9px 12px;margin-bottom:14px;font-size:11.5px;color:#5D4037">
          <i class="ti ti-info-circle"></i> El <strong>factor</strong> se calcula solo. Editar un embarque <strong>no cambia</strong> el costo de la mercancía ya recibida: ese queda sellado al momento de recibirla.
        </div>

        <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:14px" id="emb-lista"></div>

        <div style="border:1px solid var(--border);border-radius:8px;padding:12px;background:#FAFAFA">
          <div style="font-size:13px;font-weight:600;color:var(--navy);margin-bottom:10px" id="emb-form-titulo">Nuevo embarque</div>
          <input type="hidden" id="emb-id">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
            <div>
              <label style="font-size:11px;color:var(--dgray);font-weight:500;display:block;margin-bottom:3px">Código</label>
              <input type="text" class="val-input" id="emb-codigo" placeholder="PANEGOSSI-2026-01" style="width:100%;text-transform:uppercase">
            </div>
            <div>
              <label style="font-size:11px;color:var(--dgray);font-weight:500;display:block;margin-bottom:3px">Proveedor</label>
              <input type="text" class="val-input" id="emb-proveedor" placeholder="PANEGOSSI" style="width:100%;text-transform:uppercase">
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px">
            <div>
              <label style="font-size:11px;color:var(--dgray);font-weight:500;display:block;margin-bottom:3px">Fecha llegada</label>
              <input type="date" class="val-input" id="emb-fecha" style="width:100%">
            </div>
            <div>
              <label style="font-size:11px;color:var(--dgray);font-weight:500;display:block;margin-bottom:3px">FOB total USD</label>
              <input type="number" step="0.01" class="val-input" id="emb-fob" placeholder="10181.00" style="width:100%" oninput="_embRecalc()">
            </div>
            <div>
              <label style="font-size:11px;color:var(--dgray);font-weight:500;display:block;margin-bottom:3px">Monto flete+aduana USD</label>
              <input type="number" step="0.01" class="val-input" id="emb-flete" placeholder="3686.28" style="width:100%" oninput="_embRecalc()">
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px">
            <div>
              <label style="font-size:11px;color:var(--dgray);font-weight:500;display:block;margin-bottom:3px">% sobre FOB (se calcula solo)</label>
              <input type="number" step="0.0001" class="val-input" id="emb-pct-flete" style="width:100%" oninput="_embRecalc(true)">
            </div>
            <div>
              <label style="font-size:11px;color:var(--dgray);font-weight:500;display:block;margin-bottom:3px">% comisión banco</label>
              <input type="number" step="0.0001" class="val-input" id="emb-pct-com" value="2" style="width:100%" oninput="_embRecalc(true)">
            </div>
            <div>
              <label style="font-size:11px;color:var(--dgray);font-weight:500;display:block;margin-bottom:3px">% compra divisas</label>
              <input type="number" step="0.0001" class="val-input" id="emb-pct-div" value="25" style="width:100%" oninput="_embRecalc(true)">
            </div>
          </div>
          <div id="emb-preview" style="background:var(--navy);color:#fff;border-radius:6px;padding:10px 12px;font-size:12.5px;margin-bottom:10px"></div>
          <div style="display:flex;gap:8px;justify-content:flex-end">
            <button class="btn btn-secondary btn-sm" onclick="_embLimpiar()">Limpiar</button>
            <button class="btn btn-primary btn-sm" id="emb-btn-guardar" onclick="guardarEmbarque()"><i class="ti ti-check"></i> Guardar embarque</button>
          </div>
        </div>

        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;border-top:1px solid var(--gray);padding-top:12px">
          <button class="btn btn-secondary" onclick="cerrarEmbarques()">Cerrar</button>
        </div>
      </div>
    </div>

    <!-- ═══ MODAL EQUIPO DE TRABAJO (v13.2) ═══ -->
