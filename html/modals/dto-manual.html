  <div class="modal" id="modal-dto-manual">
    <div class="modal-content" style="max-width:440px;text-align:left">
      <div
        style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;border-bottom:1px solid var(--gray);padding-bottom:12px">
        <h2 style="margin:0;text-align:left;font-size:16px"><i class="ti ti-discount"></i> Descuento manual</h2>
        <button class="btn btn-secondary btn-sm" onclick="cerrarDescuentoManual()"><i class="ti ti-x"></i></button>
      </div>
      <div
        style="background:#FFF8E1;border:1px solid #FFC107;border-radius:6px;padding:8px 12px;font-size:11.5px;color:#5D4037;margin-bottom:14px">
        <i class="ti ti-info-circle"></i> En Venta Directa el precio normal es público. Este descuento es una excepción
        puntual y queda registrado en la bitácora con tu nombre.
      </div>
      <div class="field-row">
        <label>Descuento %:</label>
        <input type="number" id="dto-manual-pct" min="0" max="50" step="0.5" value="0" style="width:100px"
          oninput="previewDtoManual()">
        <span style="color:var(--dgray);font-size:12px">máximo 50%</span>
      </div>
      <div id="dto-manual-preview"
        style="background:var(--gray);border-radius:6px;padding:10px 12px;font-size:12px;color:var(--dgray);margin-top:10px">
        Selecciona un porcentaje para ver el efecto.
      </div>
      <div class="field-row" style="flex-direction:column;align-items:flex-start;gap:6px;margin-top:10px">
        <label>Motivo (obligatorio):</label>
        <input type="text" id="dto-manual-motivo"
          placeholder="Ej: Cliente frecuente, compra de contado, ajuste por competencia" style="width:100%">
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
        <button class="btn btn-secondary" onclick="cerrarDescuentoManual()">Cancelar</button>
        <button class="btn btn-green" onclick="aplicarDescuentoManual()"><i class="ti ti-check"></i> Aplicar
          descuento</button>
      </div>
    </div>
  </div>

  </div> <!-- fin #app -->
