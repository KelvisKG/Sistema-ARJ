  <div class="modal" id="modal-apartado">
    <div class="modal-content" style="max-width:560px;text-align:left">
      <div
        style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;border-bottom:1px solid var(--gray);padding-bottom:12px">
        <h2 style="margin:0;text-align:left"><i class="ti ti-clock-pause"></i> Nuevo apartado</h2>
        <button class="btn btn-secondary btn-sm" onclick="cerrarApartado()"><i class="ti ti-x"></i></button>
      </div>
      <div
        style="background:#E8F5E9;border:1px solid #66BB6A;border-radius:6px;padding:10px 12px;font-size:11.5px;color:#1B5E20;margin-bottom:14px">
        <i class="ti ti-info-circle"></i> El stock será reservado por <strong>48 horas</strong>. Si el cliente no
        factura en ese tiempo, se libera automáticamente y vuelve al inventario disponible.
      </div>
      <div class="field-row"><label>Cliente:</label><select id="apa-cliente">
          <option>-- Selecciona --</option>
        </select></div>
      <div class="field-row" style="flex-direction:column;align-items:flex-start;gap:6px">
        <label>Razón del apartado:</label>
        <input type="text" id="apa-razon"
          placeholder="Ej: Espera transferencia del cliente, busca después del almuerzo..."
          style="width:100%;background:#FFF;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:13px;font-family:inherit">
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
        <button class="btn btn-secondary" onclick="cerrarApartado()">Cancelar</button>
        <button class="btn btn-primary" onclick="crearApartado()"><i class="ti ti-check"></i> Crear apartado</button>
      </div>
    </div>
  </div>
