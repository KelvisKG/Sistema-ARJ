    <div class="modal" id="modal-recepcion">
      <div class="modal-content" style="max-width:820px;text-align:left;max-height:90vh;overflow-y:auto">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;border-bottom:1px solid var(--gray);padding-bottom:12px">
          <h3 style="margin:0;font-size:18px;color:var(--navy);font-weight:600"><i class="ti ti-truck-delivery"></i> Recepción de mercancía</h3>
          <button class="btn btn-secondary btn-sm" onclick="cerrarRecepcion()"><i class="ti ti-x"></i></button>
        </div>
        <div>

          <!-- PASO 1: pegar -->
          <div id="rec-paso1">
            <div style="background:var(--lblue);border-radius:6px;padding:9px 12px;margin-bottom:12px;font-size:11.5px;color:var(--navy)">
              <i class="ti ti-info-circle"></i> Pega una línea por producto: <strong>código</strong> y <strong>cantidad</strong>, separados por tabulador, coma, punto y coma o espacios. Copiar y pegar desde Excel funciona directo.
            </div>

            <div style="display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap">
              <div style="flex:1.4;min-width:200px">
                <label style="font-size:11px;color:var(--dgray);font-weight:500;display:block;margin-bottom:3px">¿Qué vas a hacer?</label>
                <select class="val-input" id="rec-modo" style="width:100%" onchange="recAvisoModo()">
                  <option value="conteo">Conteo físico — comparar contra el sistema</option>
                  <option value="recepcion">Recepción — sumar al stock actual</option>
                </select>
              </div>
              <div style="flex:1;min-width:150px">
                <label style="font-size:11px;color:var(--dgray);font-weight:500;display:block;margin-bottom:3px">Almacén</label>
                <select class="val-input" id="rec-destino" style="width:100%">
                  <option value="dist">Distribuidora</option>
                  <option value="vd">Venta Directa</option>
                </select>
              </div>
              <div style="flex:1;min-width:150px" id="rec-wrap-prov">
                <label style="font-size:11px;color:var(--dgray);font-weight:500;display:block;margin-bottom:3px">Solo marca</label>
                <select class="val-input" id="rec-proveedor" style="width:100%"></select>
              </div>
              <div style="flex:1;min-width:150px">
                <label style="font-size:11px;color:var(--dgray);font-weight:500;display:block;margin-bottom:3px">Referencia</label>
                <input type="text" class="val-input" id="rec-ref" placeholder="Ej: Contenedor Santos 1" style="width:100%">
              </div>
              <div style="flex:1.4;min-width:230px">
                <label style="font-size:11px;color:var(--dgray);font-weight:500;display:block;margin-bottom:3px">Embarque (sella el costo)</label>
                <select class="val-input" id="rec-embarque" style="width:100%" onchange="recAvisoEmbarque()"></select>
              </div>
            </div>
            <div id="rec-aviso-embarque"></div>

            <div id="rec-aviso-modo"></div>

            <div style="display:flex;gap:8px;align-items:flex-end;margin-bottom:8px;flex-wrap:wrap">
              <div style="flex:1;min-width:170px">
                <label style="font-size:11px;color:var(--dgray);font-weight:500;display:block;margin-bottom:3px">Traer códigos del sistema por marca</label>
                <select class="val-input" id="rec-marca" style="width:100%"></select>
              </div>
              <button class="btn btn-secondary btn-sm" onclick="recTraerMarca()"><i class="ti ti-download"></i> Traer al cuadro</button>
            </div>
            <textarea id="rec-texto" placeholder="5198060	12&#10;82025254	4&#10;5191547-2	30"
              style="width:100%;min-height:180px;background:#FFF;border:1px solid var(--border);border-radius:6px;padding:10px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;resize:vertical"></textarea>
          </div>

          <!-- PASO 2: preview -->
          <div id="rec-paso2" style="display:none">
            <div id="rec-resumen"></div>
            <div id="rec-tabla" style="max-height:320px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;margin-top:10px"></div>
          </div>

          <!-- PASO 3: resultado -->
          <div id="rec-paso3" style="display:none"></div>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;border-top:1px solid var(--gray);padding-top:12px">
          <button class="btn btn-secondary" onclick="cerrarRecepcion()" id="rec-btn-cancelar">Cancelar</button>
          <button class="btn btn-secondary" onclick="recVolver()" id="rec-btn-volver" style="display:none">← Corregir</button>
          <button class="btn btn-primary" onclick="recAnalizar()" id="rec-btn-analizar"><i class="ti ti-eye"></i> Revisar antes de aplicar</button>
          <button class="btn btn-secondary" onclick="recExportar()" id="rec-btn-exportar" style="display:none"><i class="ti ti-file-spreadsheet"></i> Descargar reporte</button>
          <button class="btn btn-primary" onclick="recAplicar()" id="rec-btn-aplicar" style="display:none"><i class="ti ti-check"></i> Aplicar</button>
        </div>
      </div>
    </div>

    <!-- ═══ MODAL NUEVO CONTACTO (v13.3) ═══ -->
