  <div class="modal" id="modal-nuevo-cliente-rapido">
    <div class="modal-content" style="max-width:560px;text-align:left">
      <div
        style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:10px">
        <h2 style="margin:0;font-size:16px" id="ncr-titulo"><i class="ti ti-user-plus" style="color:var(--blue)"></i> Nuevo cliente</h2>
        <button class="btn btn-secondary btn-sm" onclick="cerrarNuevoClienteRapido()"><i class="ti ti-x"></i></button>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;max-height:70vh;overflow-y:auto;padding-right:6px">
        <div>
          <label style="font-size:12px;font-weight:600;display:block;margin-bottom:3px">Nombre / Razón social *</label>
          <input type="text" id="ncr-nombre" placeholder="Ej: AGROPECUARIA EL SOL C.A."
            style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <div>
            <label style="font-size:12px;font-weight:600;display:block;margin-bottom:3px">RIF / Cédula</label>
            <input type="text" id="ncr-rif" placeholder="J-12345678-9 o V-12345678"
              style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit">
          </div>
          <div>
            <label style="font-size:12px;font-weight:600;display:block;margin-bottom:3px">Teléfono</label>
            <input type="text" id="ncr-tel" placeholder="0414-1234567"
              style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit">
          </div>
        </div>
        <div>
          <label style="font-size:12px;font-weight:600;display:block;margin-bottom:3px">Correo electrónico</label>
          <input type="email" id="ncr-correo" placeholder="cliente@correo.com"
            style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit">
        </div>
        <div>
          <label style="font-size:12px;font-weight:600;display:block;margin-bottom:3px">Dirección</label>
          <input type="text" id="ncr-direccion" placeholder="Calle, ciudad, estado"
            style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <div>
            <label style="font-size:12px;font-weight:600;display:block;margin-bottom:3px">Persona de contacto</label>
            <input type="text" id="ncr-contacto" placeholder="Nombre del contacto"
              style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit">
          </div>
          <div>
            <label style="font-size:12px;font-weight:600;display:block;margin-bottom:3px">Cargo</label>
            <input type="text" id="ncr-cargo" placeholder="Ej: Comprador, Dueño"
              style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit">
          </div>
        </div>
        <div
          style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;background:var(--sky);border-radius:6px">
          <div>
            <label style="font-size:12px;font-weight:600;display:block;margin-bottom:3px">Canal de venta *</label>
            <select id="ncr-canal" onchange="ncrToggleTier()"
              style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit">
              <option value="directa">Venta Directa (productor final)</option>
              <option value="dist">Distribuidora (revendedor)</option>
              <option value="ambas">Ambas empresas</option>
            </select>
            <div id="ncr-aviso-canal" style="display:none;margin-top:5px;font-size:11px;color:#8A6D0B;background:#FFF8E1;border:1px solid #E6C860;border-radius:5px;padding:5px 7px"></div>
          </div>
          <div id="ncr-tier-wrap">
            <label style="font-size:12px;font-weight:600;display:block;margin-bottom:3px">Nivel de precio</label>
            <select id="ncr-nivel"
              style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit">
              <option value="Publico">Público (sin descuento)</option>
              <option value="T1">T1 — Aliado (−5%)</option>
              <option value="T2">T2 — Aliado (−10%)</option>
              <option value="T3">T3 — Aliado (−20%)</option>
            </select>
          </div>
        </div>
        <div style="padding:10px;background:#F3F6FA;border:1px solid var(--border);border-radius:6px">
          <label style="font-size:12px;font-weight:600;display:block;margin-bottom:3px">¿Cómo nos consiguió? *</label>
          <select id="ncr-origen" onchange="ncrToggleOrigen()"
            style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit">
            <option value="">— Selecciona —</option>
            <optgroup label="Digital">
              <option value="instagram">Instagram</option>
              <option value="facebook">Facebook</option>
              <option value="tiktok">TikTok</option>
              <option value="whatsapp">WhatsApp directo (número publicado)</option>
            </optgroup>
            <optgroup label="Boca a boca">
              <option value="referido">Referido por otro cliente</option>
              <option value="visita">Llegó al local por su cuenta</option>
            </optgroup>
            <optgroup label="Esfuerzo propio">
              <option value="vendedor">Prospección del vendedor</option>
              <option value="feria">Feria / evento agrícola</option>
            </optgroup>
            <optgroup label="Otros">
              <option value="otro">Otro</option>
              <option value="historico">Anterior al registro (cliente viejo)</option>
            </optgroup>
          </select>
          <div id="ncr-origen-detalle-wrap" style="display:none;margin-top:7px">
            <label id="ncr-origen-detalle-lbl" style="font-size:11.5px;font-weight:600;display:block;margin-bottom:3px;color:var(--dgray)">Detalle</label>
            <input type="text" id="ncr-origen-detalle" placeholder=""
              style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;font-family:inherit">
          </div>
          <div style="font-size:10.5px;color:var(--dgray);margin-top:6px;line-height:1.4">
            Esto es lo único que te va a decir, dentro de seis meses, si el contenido sirvió o si todo vino por referidos.
          </div>
        </div>
        <div>
          <label style="font-size:12px;font-weight:600;display:block;margin-bottom:3px">Notas</label>
          <textarea id="ncr-notas" placeholder="Información adicional sobre el cliente..." rows="2"
            style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;resize:vertical"></textarea>
        </div>
        <div
          style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px;border-top:1px solid var(--border);padding-top:10px">
          <button class="btn btn-secondary" onclick="cerrarNuevoClienteRapido()">Cancelar</button>
          <button class="btn btn-primary" onclick="guardarClienteRapido()" id="ncr-btn-guardar"><i class="ti ti-check"></i> Crear y
            seleccionar</button>
        </div>
      </div>
    </div>
  </div>
  <!-- Modal: elegir formato de lista de precios -->
