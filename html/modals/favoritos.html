  <div class="modal" id="modal-favoritos">
    <div class="modal-content" style="max-width:760px;text-align:left">
      <div
        style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;border-bottom:1px solid var(--gray);padding-bottom:12px">
        <div>
          <h2 style="margin:0;text-align:left"><i class="ti ti-star"></i> Gestionar mis favoritos</h2>
          <p style="margin:3px 0 0;color:var(--dgray);font-size:13px">Agrega o quita tus productos de acceso rápido
            (máximo 12)</p>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="cerrarGestorFavoritos()"><i class="ti ti-x"></i></button>
      </div>
      <div
        style="background:#FFF8E1;border:1px solid #FFC107;border-radius:6px;padding:8px 12px;font-size:11.5px;color:#5D4037;margin-bottom:14px">
        <i class="ti ti-info-circle"></i> Los favoritos <strong>obligatorios</strong> (estrella dorada ⭐) los define el
        gerente y no se pueden quitar. Tus favoritos personales son los que tú agregas.
      </div>
      <div class="fav-manager">
        <div>
          <h4><i class="ti ti-star-filled" style="color:var(--gold)"></i> Tus favoritos actuales (<span
              id="fm-cant">0</span>/12)</h4>
          <div class="fav-manager-list" id="fm-actuales"></div>
        </div>
        <div>
          <h4><i class="ti ti-search"></i> Agregar más productos</h4>
          <input type="text" id="fm-busqueda" placeholder="Buscar producto para agregar..."
            oninput="renderFavManagerDisponibles()"
            style="width:100%;background:#FFF;border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:12px;margin-bottom:6px;font-family:inherit">
          <div class="fav-manager-list" id="fm-disponibles"></div>
        </div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
        <button class="btn btn-primary" onclick="cerrarGestorFavoritos()"><i class="ti ti-check"></i> Listo</button>
      </div>
    </div>
  </div>
