    <div class="modal" id="modal-nuevo-contacto">
      <div class="modal-content" style="max-width:420px;text-align:left">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;border-bottom:1px solid var(--gray);padding-bottom:12px">
          <h3 style="margin:0;font-size:18px;color:var(--navy);font-weight:600"><i class="ti ti-user-plus"></i> Agregar contacto</h3>
          <button class="btn btn-secondary btn-sm" onclick="cerrarNuevoContacto()"><i class="ti ti-x"></i></button>
        </div>
        <div>
          <div style="font-size:12px;color:var(--dgray);margin-bottom:12px">Cliente: <strong id="nc-cliente-nombre" style="color:var(--navy)"></strong></div>
          <div style="margin-bottom:10px">
            <label style="font-size:11px;color:var(--dgray);font-weight:500;display:block;margin-bottom:3px">Nombre *</label>
            <input type="text" class="val-input" id="nc-nombre" placeholder="Ej: Pedro Pérez" style="width:100%"
              onkeydown="if(event.key==='Enter'){event.preventDefault();guardarNuevoContacto();}">
          </div>
          <div style="display:flex;gap:8px;margin-bottom:10px">
            <div style="flex:1">
              <label style="font-size:11px;color:var(--dgray);font-weight:500;display:block;margin-bottom:3px">Cargo</label>
              <input type="text" class="val-input" id="nc-cargo" placeholder="Ej: Almacenista" style="width:100%">
            </div>
            <div style="flex:1">
              <label style="font-size:11px;color:var(--dgray);font-weight:500;display:block;margin-bottom:3px">Teléfono</label>
              <input type="text" class="val-input" id="nc-tel" placeholder="0414-0000000" style="width:100%">
            </div>
          </div>
          <label style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dgray);cursor:pointer">
            <input type="checkbox" id="nc-principal" style="width:auto;margin:0">
            Marcar como contacto principal
          </label>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;border-top:1px solid var(--gray);padding-top:12px">
          <button class="btn btn-secondary" onclick="cerrarNuevoContacto()">Cancelar</button>
          <button class="btn btn-primary" id="nc-guardar" onclick="guardarNuevoContacto()">Guardar contacto</button>
        </div>
      </div>
    </div>
