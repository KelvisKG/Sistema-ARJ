  <div class="modal" id="modal-movimiento">
    <div class="modal-content" style="max-width:520px;text-align:left">
      <div
        style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;border-bottom:1px solid var(--gray);padding-bottom:12px">
        <h2 style="margin:0;text-align:left" id="mov-modal-tit"><i class="ti ti-arrow-up-right"></i> Registrar salida
        </h2>
        <button class="btn btn-secondary btn-sm" onclick="cerrarModalMovimiento()"><i class="ti ti-x"></i></button>
      </div>

      <label style="display:block;font-size:12px;color:var(--dgray);margin-bottom:5px">¿Cuánto?</label>
      <div style="display:flex;gap:8px;margin-bottom:4px">
        <div
          style="flex:1;display:flex;align-items:center;border:1px solid var(--border);border-radius:6px;padding:0 10px;background:var(--input-bg)">
          <span id="mov-simbolo" style="font-size:15px;color:var(--dgray);margin-right:6px">Bs</span>
          <input type="number" id="mov-monto" step="0.01" min="0" placeholder="0,00" oninput="movCalcular()"
            style="flex:1;border:none;outline:none;background:transparent;font-size:20px;font-weight:700;padding:9px 0;color:var(--text);font-family:inherit">
        </div>
        <div style="display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden">
          <button type="button" id="mov-mon-bs" onclick="movSetMoneda('Bs')"
            style="border:none;padding:0 14px;font-size:14px;font-weight:600;cursor:pointer;background:var(--navy);color:#FFF;font-family:inherit">Bs</button>
          <button type="button" id="mov-mon-usd" onclick="movSetMoneda('USD')"
            style="border:none;padding:0 14px;font-size:14px;font-weight:600;cursor:pointer;background:transparent;color:var(--dgray);font-family:inherit">$</button>
        </div>
      </div>
      <div id="mov-conversion" style="font-size:11.5px;color:var(--dgray);margin-bottom:14px">&nbsp;</div>

      <label style="display:block;font-size:12px;color:var(--dgray);margin-bottom:5px">¿En qué?</label>
      <div id="mov-cats" style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px"></div>
      <div id="mov-cat-hint" style="font-size:11.5px;color:var(--dgray);margin-bottom:14px">&nbsp;</div>

      <label style="display:block;font-size:12px;color:var(--dgray);margin-bottom:5px">¿A quién o para qué?</label>
      <input type="text" id="mov-concepto" placeholder="Ej: Cabillas y cemento — techo del galpón"
        style="width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:13px;background:var(--input-bg);color:var(--text);font-family:inherit;margin-bottom:14px">

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
        <div>
          <label style="display:block;font-size:12px;color:var(--dgray);margin-bottom:5px">¿Cómo pagó?</label>
          <select id="mov-metodo"
            style="width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:13px;background:var(--input-bg);color:var(--text);font-family:inherit">
            <option>Efectivo Bs</option>
            <option>Efectivo USD</option>
            <option>Pago móvil</option>
            <option>Transferencia Bs</option>
            <option>Transferencia USD</option>
            <option>Zelle</option>
            <option>Otro</option>
          </select>
        </div>
        <div>
          <label style="display:block;font-size:12px;color:var(--dgray);margin-bottom:5px">Fecha</label>
          <input type="date" id="mov-fecha"
            style="width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:13px;background:var(--input-bg);color:var(--text);font-family:inherit">
        </div>
      </div>

      <label style="display:block;font-size:12px;color:var(--dgray);margin-bottom:5px">¿De cuál empresa?</label>
      <div style="display:flex;gap:5px;margin-bottom:4px">
        <button type="button" id="mov-emp-directa" onclick="movSetEmpresa('directa')" class="mov-chip">Venta
          Directa</button>
        <button type="button" id="mov-emp-dist" onclick="movSetEmpresa('dist')" class="mov-chip">Distribuidora</button>
        <button type="button" id="mov-emp-ambas" onclick="movSetEmpresa('ambas')" class="mov-chip">Ambas</button>
      </div>
      <div id="mov-emp-hint" style="font-size:11.5px;color:var(--dgray);margin-bottom:14px">&nbsp;</div>

      <div
        style="display:flex;gap:8px;justify-content:flex-end;margin-top:4px;padding-top:12px;border-top:1px solid var(--gray)">
        <button class="btn btn-secondary" onclick="cerrarModalMovimiento()">Cancelar</button>
        <button class="btn btn-primary" id="mov-btn-guardar" onclick="guardarMovimiento()"><i
            class="ti ti-device-floppy"></i> Guardar</button>
      </div>
    </div>
  </div>

  <!-- MODAL ADVERTENCIA EMPRESA DISTINTA -->
