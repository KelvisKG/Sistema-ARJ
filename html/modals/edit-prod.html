  <div class="modal" id="modal-edit-prod">
    <div class="modal-content" style="max-width:600px;text-align:left;max-height:90vh;overflow-y:auto">
      <div
        style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;border-bottom:1px solid var(--gray);padding-bottom:12px">
        <h2 style="margin:0;text-align:left">Editar producto</h2>
        <button class="btn btn-secondary btn-sm" onclick="cerrarEditProducto()"><i class="ti ti-x"></i></button>
      </div>
      <div id="edit-prod-fields">
        <div class="field-row"><label>Código alternativo:</label><input type="text" id="ep-cod-alt" readonly
            style="background:#F5F5F5;color:var(--dgray)"></div>
        <div class="field-row"><label>Código original:</label><input type="text" id="ep-cod-orig"></div>
        <div class="field-row"><label>Código de barras:</label><input type="text" id="ep-cod-barras"
            placeholder="Pasa el lector o escribe el código EAN/UPC"
            style="font-family:'Courier New',monospace;letter-spacing:1px"></div>
        <div class="field-row"><label>Descripción:</label><input type="text" id="ep-desc"></div>
        <div class="field-row"><label>Marca:</label><input type="text" id="ep-marca"></div>

        <!-- BLOQUE NUEVO: APLICACIÓN ESTRUCTURADA -->
        <div style="background:#F5F8FC;border-radius:6px;padding:10px 12px;margin:10px 0">
          <div
            style="font-size:11px;color:var(--dgray);text-transform:uppercase;letter-spacing:.04em;font-weight:500;margin-bottom:8px">
            <i class="ti ti-tractor"></i> Aplicación del producto</div>
          <div class="field-row"><label>Marca y modelo:</label><input type="text" id="ep-marca-modelo"
              placeholder="Ej: John Deere 6420, Ford 5000..."></div>
          <div class="field-row">
            <label>Sistema:</label>
            <select id="ep-sistema">
              <option value="">-- Selecciona --</option>
            </select>
            <button type="button" class="btn btn-secondary btn-sm" onclick="agregarSistemaNuevo()"
              title="Agregar nuevo sistema"><i class="ti ti-plus"></i></button>
          </div>
        </div>

        <!-- BLOQUE NUEVO: PRECIOS -->
        <div style="background:#FFF8E1;border-radius:6px;padding:10px 12px;margin:10px 0">
          <div
            style="font-size:11px;color:var(--dgray);text-transform:uppercase;letter-spacing:.04em;font-weight:500;margin-bottom:8px">
            <i class="ti ti-currency-dollar"></i> Precios del producto</div>
          <div style="font-size:11px;color:var(--dgray);margin:0 0 5px">Origen de la mercancía:</div>
          <div style="display:flex;gap:6px;margin:0 0 9px;flex-wrap:wrap">
            <button type="button" class="btn-multi" id="ep-org-importado"
              onclick="epSetOrigen('importado')">Importado<small>flete + aduana</small></button>
            <button type="button" class="btn-multi" id="ep-org-local"
              onclick="epSetOrigen('local')">Compra local<small>ya está aquí</small></button>
          </div>
          <div class="field-row"><label id="ep-lbl-fob">Costo FOB USD:</label><input type="number" id="ep-fob" step="0.01"
              oninput="actualizarPreviewPrecio()"></div>
          <div class="field-row"><label>Factor landed:</label><input type="number" id="ep-factor" step="0.001" min="1"
              max="5" oninput="actualizarPreviewPrecio()"></div>
          <div class="field-row"><label>Proveedor:</label><input type="text" id="ep-proveedor" list="lista-proveedores"
              placeholder="Ej: PANEGOSSI"><datalist id="lista-proveedores"></datalist></div>
          <div style="font-size:11px;color:var(--dgray);margin:6px 0 3px">Atajos — multiplican el <strong>costo puesto aquí</strong> (FOB × factor). El % es el margen que te queda:</div>
          <div style="display:flex;gap:5px;margin:0 0 10px;flex-wrap:wrap">
            <button type="button" class="btn-multi"
              onclick="aplicarMultiplicador(1.0)">×1.00<small>al costo</small></button>
            <button type="button" class="btn-multi"
              onclick="aplicarMultiplicador(1.5)">×1.50<small>33% mg</small></button>
            <button type="button" class="btn-multi"
              onclick="aplicarMultiplicador(1.8)">×1.80<small>44% mg</small></button>
            <button type="button" class="btn-multi"
              onclick="aplicarMultiplicador(2.0)">×2.00<small>50% mg</small></button>
            <button type="button" class="btn-multi"
              onclick="aplicarMultiplicador(2.25)">×2.25<small>56% mg</small></button>
            <button type="button" class="btn-multi"
              onclick="aplicarMultiplicador(2.5)">×2.50<small>60% mg</small></button>
          </div>
          <div class="field-row" style="background:#FFFFFF;border:2px solid var(--gold);border-radius:6px;padding:8px 10px;margin:0">
            <label style="font-weight:700;color:var(--navy)">Precio de venta USD:</label>
            <input type="number" id="ep-precio-manual" step="0.01" placeholder="Vacío = usa el ×2.5 automático"
              style="font-size:16px;font-weight:700;color:var(--navy)"
              oninput="actualizarPreviewPrecio()">
          </div>
          <div id="ep-preview-precio"
            style="background:#FFF;border-radius:5px;padding:8px 10px;font-size:12px;color:var(--dgray);margin-top:6px">
            Precio público sugerido: <strong style="color:var(--navy)">— USD</strong>
          </div>
        </div>

        <div class="field-row"><label>Stock Venta Directa:</label><input type="number" id="ep-stock-vd"></div>
        <div class="field-row"><label>Stock Distribuidora:</label><input type="number" id="ep-stock-dist"></div>
        <div class="field-row" style="margin-top:8px"><label>Fotos (máx 3):</label>
          <div style="flex:1">
            <div id="ep-fotos-preview" style="display:flex;gap:8px;margin-bottom:6px"></div>
            <input type="file" id="ep-foto" accept="image/*" multiple style="width:100%">
          </div>
        </div>
      </div>
      <div
        style="background:#FFF8E1;border:1px solid #FFE082;border-radius:6px;padding:8px 10px;font-size:11.5px;color:#5D4037;margin-top:12px">
        <i class="ti ti-info-circle"></i> Los cambios se reflejarán inmediatamente en la cuenta de los vendedores.
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
        <button class="btn btn-secondary" onclick="cerrarEditProducto()">Cancelar</button>
        <button class="btn btn-green" onclick="guardarEditProducto()"><i class="ti ti-check"></i> Guardar
          cambios</button>
      </div>
    </div>
  </div>

  <!-- MODAL ANULAR FACTURA -->
