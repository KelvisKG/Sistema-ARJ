  <div class="modal" id="modal-anular">
    <div class="modal-content" style="max-width:520px;text-align:left">
      <div
        style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;border-bottom:1px solid var(--gray);padding-bottom:12px">
        <div>
          <h2 style="margin:0;text-align:left;color:var(--red)"><i class="ti ti-file-x"></i> Anular factura</h2>
          <p style="margin:3px 0 0;color:var(--dgray);font-size:13px" id="anular-info">F-2026-XXXXX · Cliente</p>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="cerrarAnular()"><i class="ti ti-x"></i></button>
      </div>
      <div
        style="background:#FCEBEB;border:1px solid #F09595;border-left:4px solid var(--red);border-radius:6px;padding:10px 12px;font-size:12.5px;color:var(--red);margin-bottom:14px">
        <i class="ti ti-alert-triangle"></i> <strong>Acción irreversible.</strong> El stock será devuelto al inventario,
        la factura quedará marcada como ANULADA y los pagos registrados serán reversados.
      </div>
      <div id="anular-devolucion" style="display:none;background:#FFF8E1;border:1px solid #E6C860;border-left:4px solid var(--gold);border-radius:6px;padding:10px 12px;font-size:12.5px;color:#5D4037;margin-bottom:14px"></div>
      <div class="field-row" style="flex-direction:column;align-items:flex-start;gap:6px">
        <label>Motivo de la anulación (obligatorio):</label>
        <textarea id="anular-motivo" placeholder="Ej: Cliente devolvió la mercancía sin abrir, error en facturación..."
          style="width:100%;min-height:80px;background:#FFF;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:13px;font-family:inherit;resize:vertical"></textarea>
      </div>
      <div
        style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;padding-top:12px;border-top:1px solid var(--gray)">
        <button class="btn btn-secondary" onclick="cerrarAnular()">Cancelar</button>
        <button class="btn btn-red" onclick="confirmarAnular()"><i class="ti ti-trash"></i> Anular factura</button>
      </div>
    </div>
  </div>
