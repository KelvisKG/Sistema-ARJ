  <div class="modal" id="modal-mov-anular">
    <div class="modal-content" style="max-width:460px;text-align:left">
      <h2 style="margin:0 0 12px;text-align:left;color:var(--red);font-size:17px"><i class="ti ti-file-x"></i> Anular
        movimiento</h2>
      <p style="font-size:12.5px;color:var(--dgray);margin:0 0 12px" id="mov-anular-info"></p>
      <div
        style="background:#FCEBEB;border:1px solid #F09595;border-left:4px solid var(--red);border-radius:6px;padding:10px 12px;font-size:12.5px;color:var(--red);margin-bottom:14px">
        El movimiento no se borra: queda tachado en la lista con el motivo, y deja de sumar en los totales.
      </div>
      <label style="display:block;font-size:12px;color:var(--dgray);margin-bottom:5px">Motivo (obligatorio)</label>
      <textarea id="mov-anular-motivo" placeholder="Ej: monto equivocado, se registró dos veces..."
        style="width:100%;min-height:70px;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:13px;background:var(--input-bg);color:var(--text);font-family:inherit;resize:vertical"></textarea>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
        <button class="btn btn-secondary" onclick="cerrarMovAnular()">Cancelar</button>
        <button class="btn btn-red" onclick="confirmarMovAnular()">Anular</button>
      </div>
    </div>
  </div>
