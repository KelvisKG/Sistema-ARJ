  <div class="modal" id="modal-abrir-turno">
    <div class="modal-content" style="max-width:480px;text-align:left">
      <div
        style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;border-bottom:1px solid var(--gray);padding-bottom:12px">
        <h2 style="margin:0;text-align:left;color:var(--green)"><i class="ti ti-clock-play"></i> Abrir turno</h2>
        <button class="btn btn-secondary btn-sm" onclick="cerrarAbrirTurno()"><i class="ti ti-x"></i></button>
      </div>
      <div
        style="background:#E8F5E9;border-left:4px solid var(--green);border-radius:6px;padding:10px 12px;font-size:12px;color:#1B5E20;margin-bottom:14px">
        <i class="ti ti-info-circle"></i> Indica el efectivo con el que abres caja. Al cerrar el turno el sistema
        cuadrará automáticamente.
      </div>
      <div class="field-row"><label>Vendedor:</label><input type="text" id="turno-vendedor" readonly
          style="background:#F5F5F5"></div>
      <div class="field-row"><label>Empresa:</label><input type="text" id="turno-empresa" readonly
          style="background:#F5F5F5"></div>
      <div class="field-row"><label>Efectivo USD:</label><input type="number" id="turno-efectivo-usd" placeholder="0.00"
          step="0.01" value="0"></div>
      <div class="field-row"><label>Efectivo Bs.:</label><input type="number" id="turno-efectivo-bs" placeholder="0.00"
          step="0.01" value="0"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
        <button class="btn btn-secondary" onclick="cerrarAbrirTurno()">Cancelar</button>
        <button class="btn btn-green" onclick="confirmarAbrirTurno()"><i class="ti ti-check"></i> Abrir turno</button>
      </div>
    </div>
  </div>
