    <div class="page" id="page-bitacora">
      <h1 class="page-title"><i class="ti ti-history"></i> Bitácora de actividad</h1>
      <p class="page-sub">Registro de todas las acciones importantes · Solo visible para el gerente</p>

      <div class="help-box">
        <i class="ti ti-info-circle"></i>
        <div><strong>¿Por qué es importante?</strong> Cada acción crítica queda registrada: quién, cuándo, qué cambió.
          Si hay un descuadre o discusión, aquí encuentras la respuesta. Los registros NO se pueden borrar ni editar.
        </div>
      </div>

      <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">
        <select id="bitacora-filtro-usuario" onchange="renderBitacora()"
          style="background:#FFF;border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px;font-family:inherit">
          <option value="">Todos los usuarios</option>
          <option value="Gerente">Gerente</option>
          <option value="María">María</option>
          <option value="Carlos">Carlos</option>
          <option value="Luis">Luis</option>
        </select>
        <select id="bitacora-filtro-empresa" onchange="renderBitacora()"
          style="background:#FFF;border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px;font-family:inherit">
          <option value="">Ambas empresas</option>
          <option value="directa">Venta Directa</option>
          <option value="dist">Distribuidora</option>
        </select>
        <select id="bitacora-filtro-accion" onchange="renderBitacora()"
          style="background:#FFF;border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px;font-family:inherit">
          <option value="">Todas las acciones</option>
          <option value="factura">Facturación</option>
          <option value="anulacion">Anulaciones</option>
          <option value="precio">Cambios de precio</option>
          <option value="inventario">Inventario</option>
          <option value="login">Inicios de sesión</option>
          <option value="cliente">Clientes</option>
        </select>
        <button class="btn btn-secondary btn-sm"
          onclick="descargarBitacoraCSV()"><i class="ti ti-download"></i>
          Exportar</button>
      </div>

      <div class="card" style="padding:0">
        <div id="bitacora-list"></div>
      </div>
    </div>
