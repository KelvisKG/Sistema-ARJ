    <div class="page" id="page-historial">
      <h1 class="page-title"><i class="ti ti-file-text"></i> Historial de documentos</h1>
      <p class="page-sub">Facturas y cotizaciones emitidas · Buscar, reimprimir, anular</p>

      <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center">
        <div style="display:flex;gap:4px">
          <button class="btn btn-sm" data-tab-hist="facturas" onclick="tabHistorial('facturas')"
            style="background:var(--navy);color:#FFF">Facturas</button>
          <button class="btn btn-sm btn-secondary" data-tab-hist="cotizaciones"
            onclick="tabHistorial('cotizaciones')">Cotizaciones</button>
        </div>
        <input type="text" id="hist-buscar" placeholder="Buscar por N°, cliente o vendedor..."
          oninput="renderHistorial()"
          style="flex:1;min-width:200px;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit">
        <select id="hist-estado" onchange="renderHistorial()"
          style="padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit">
          <option value="">Todos (sin anuladas)</option>
          <option value="pagada">Pagadas</option>
        <option value="no_pagada">No pagadas (pend.+parc.+venc.)</option>
          <option value="pendiente">Pendientes</option>
          <option value="parcial">Parciales</option>
          <option value="vencida">Vencidas</option>
          <option value="anulada">Anuladas</option>
        </select>
      </div>

      <div style="display:flex;gap:8px;margin-bottom:14px">
        <div class="kpi-card blue" style="margin:0;padding:10px 14px;cursor:pointer" onclick="filtrarHist('')" title="Ver todas"><div class="kpi-label">Total facturas</div><div class="kpi-val" style="font-size:18px" id="hist-total-facturas">0</div></div>
        <div class="kpi-card green" style="margin:0;padding:10px 14px;cursor:pointer" onclick="filtrarHist('pagada')" title="Filtrar pagadas"><div class="kpi-label">Pagadas</div><div class="kpi-val" style="font-size:18px;color:var(--green)" id="hist-pagadas">0</div></div>
        <div class="kpi-card gold" style="margin:0;padding:10px 14px;cursor:pointer" onclick="filtrarHist('no_pagada')" title="Filtrar no pagadas"><div class="kpi-label">Pendientes</div><div class="kpi-val" style="font-size:18px;color:var(--gold)" id="hist-pendientes">0</div></div>
        <div class="kpi-card" style="margin:0;padding:10px 14px;background:#E8F5E9">
          <div class="kpi-label">Ventas del mes</div>
          <div class="kpi-val" style="font-size:18px;color:var(--green)" id="hist-ventas-mes">$ 0</div>
        </div>
      </div>

      <div id="historial-tabla" style="overflow-x:auto"></div>
    </div>
