    <div class="page" id="page-clientes">
      <h1 class="page-title"><i class="ti ti-users"></i> Clientes</h1>
      <p class="page-sub">Listado de clientes registrados · Nivel asignado · Saldo deudor</p>

      <div class="help-box">
        <i class="ti ti-info-circle"></i>
        <div><strong>Tip:</strong> Haz clic en cualquier fila para ver detalles del cliente, sus contactos adicionales
          (jefe, almacén, compras) y todas sus facturas.</div>
      </div>

      <div id="clientes-origen-panel" style="margin-bottom:10px"></div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <input type="text" id="buscar-cliente-lista" placeholder="Buscar cliente..." oninput="renderClientes()"
          style="padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;width:250px">
        <button class="btn btn-primary btn-sm" onclick="abrirNuevoClienteRapido()"><i class="ti ti-user-plus"></i> Nuevo
          cliente</button>
      </div>

      <div class="card">
        <table class="simple-tbl">
          <thead>
            <tr>
              <th>Cliente</th>
              <th>RIF</th>
              <th>Tel. principal</th>
              <th>Contacto</th>
              <th>Nivel</th>
              <th>Tipo</th>
              <th>Origen</th>
              <th style="text-align:right">Saldo</th>
            </tr>
          </thead>
          <tbody id="clientes-body"></tbody>
        </table>
      </div>
    </div>
